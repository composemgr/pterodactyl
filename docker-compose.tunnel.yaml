name: pterodactyl
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    container_name: pterodactyl-panel
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: pterodactyl-panel
      APP_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      APP_KEY: base64:${APP_ENCRYPTION_KEY:-replace-with-a-random-base64-key}
      APP_DEBUG: 'false'
      # Database
      DB_HOST: pterodactyl-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-pterodactyl}
      DB_USERNAME: ${DB_USER_NAME:-pterodactyl}
      DB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      # Cache
      CACHE_DRIVER: redis
      REDIS_HOST: pterodactyl-redis
      REDIS_PORT: 6379
      # Queue
      QUEUE_CONNECTION: redis
    volumes:
      - './volumes/config/pterodactyl:/var/www/html:z'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://pterodactyl-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - pterodactyl
      - cloudflare

  db:
    image: mariadb:latest
    container_name: pterodactyl-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: pterodactyl-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: pterodactyl-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-pterodactyl}
      MARIADB_USER: ${DB_USER_NAME:-pterodactyl}
      MARIADB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/mariadb/pterodactyl:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pterodactyl

  redis:
    image: redis:alpine
    container_name: pterodactyl-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: pterodactyl-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      CONTAINER_NAME: pterodactyl-redis
    volumes:
      - './volumes/db/redis/pterodactyl:/var/lib/redis/data:z'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pterodactyl

networks:
  pterodactyl:
    name: pterodactyl
    external: false
  cloudflare:
    name: cloudflare
    external: true
