# nginx proxy address - http://172.17.0.1:8095

name: pterodactyl
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  pterodactyl:
    image: ghcr.io/pterodactyl/panel:latest
    pull_policy: always
    container_name: pterodactyl-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - pterodactyl
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8095:80"
    environment:
      TZ: ${TZ:-America/New_York}
      APP_ENV: production
      APP_URL: https://${BASE_HOST_NAME:-localhost}.${BASE_DOMAIN_NAME:-example.com}
      APP_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      APP_TIMEZONE: ${TZ:-America/New_York}
      DB_CONNECTION: mysql
      DB_HOST: pterodactyl-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-pterodactyl}
      DB_USERNAME: ${DB_USER_NAME:-pterodactyl}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: pterodactyl-redis
      REDIS_PORT: 6379
      MAIL_DRIVER: ${EMAIL_DRIVER:-log}
      MAIL_HOST: ${EMAIL_SERVER_HOST:-localhost}
      MAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-""}
      MAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-""}
      MAIL_FROM: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      MAIL_ENCRYPTION: ${EMAIL_ENCRYPTION:-tls}
      CONTAINER_NAME: pterodactyl-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/pterodactyl:/app/var/
      - ./volumes/config/pterodactyl:/etc/nginx/conf.d/
    depends_on:
      pterodactyl-db:
        condition: service_healthy
      pterodactyl-redis:
        condition: service_started
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://pterodactyl-app:80'
      - 'cloudflare.hostname=pterodactyl.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.pterodactyl-app.entrypoints=http'
      - 'traefik.http.routers.pterodactyl-app-secure.tls=true'
      - 'traefik.http.routers.pterodactyl-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.pterodactyl-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.pterodactyl-app.middlewares=pterodactyl-app-https-redirect'
      - 'traefik.http.routers.pterodactyl-app-secure.entrypoints=https'
      - 'traefik.http.routers.pterodactyl-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.pterodactyl-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.pterodactyl-app-secure.service=pterodactyl-app'
      - 'traefik.http.services.pterodactyl-app.loadbalancer.server.port=80'

  pterodactyl-db:
    image: mariadb:latest
    pull_policy: always
    container_name: pterodactyl-db
    restart: always
    logging: *default-logging
    networks:
      - pterodactyl
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-pterodactyl}
      MARIADB_USER: ${DB_USER_NAME:-pterodactyl}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: pterodactyl-db
    volumes:
      - ./volumes/data/db/mariadb/pterodactyl:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

  pterodactyl-redis:
    image: redis:alpine
    pull_policy: always
    container_name: pterodactyl-redis
    restart: always
    logging: *default-logging
    networks:
      - pterodactyl
    environment:
      CONTAINER_NAME: pterodactyl-redis
    volumes:
      - ./volumes/data/db/redis/pterodactyl:/data

networks:
  pterodactyl:
    name: pterodactyl
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
